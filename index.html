<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}

/* Performance Optimizations */
html, body {
  will-change: scroll-position;
}

* {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* GPU Acceleration */
@media (prefers-reduced-motion: no-preference) {
  * {
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    perspective: 1000px;
  }
}

/* Smooth Scrolling */
html {
  scroll-behavior: smooth;
}

/* Animation Performance */
@keyframes fadeInScale {
  from {
    opacity: 0;
    transform: scale(0.95) translateZ(0);
  }
  to {
    opacity: 1;
    transform: scale(1) translateZ(0);
  }
}

@keyframes slideInUp {
  from {
    opacity: 0;
    transform: translateY(30px) translateZ(0);
  }
  to {
    opacity: 1;
    transform: translateY(0) translateZ(0);
  }
}

@keyframes floatSmooth {
  0%, 100% {
    transform: translateY(0px) translateZ(0);
  }
  50% {
    transform: translateY(-20px) translateZ(0);
  }
}

@keyframes glowPulse {
  0%, 100% {
    opacity: 0.5;
    transform: scale(1) translateZ(0);
  }
  50% {
    opacity: 0.8;
    transform: scale(1.05) translateZ(0);
  }
}

@keyframes smoothRotate {
  from {
    transform: rotate(0deg) translateZ(0);
  }
  to {
    transform: rotate(360deg) translateZ(0);
  }
}

/* Accessibility - Respect motion preferences */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Optimized Transitions */
a, button, input, textarea, select {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: auto;
}

a:hover, button:hover {
  will-change: transform, box-shadow;
}

/* Scroll Performance */
.scroll-smooth {
  scroll-behavior: smooth;
  will-change: scroll-position;
}

/* Animation Elements */
[data-animate] {
  animation-name: fadeInScale;
  animation-duration: 0.8s;
  animation-fill-mode: both;
  animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
}

[data-float] {
  animation: floatSmooth 4s ease-in-out infinite;
}

[data-glow] {
  animation: glowPulse 3s ease-in-out infinite;
}

[data-rotate] {
  animation: smoothRotate 20s linear infinite;
}

/* Intersection Observer for scroll animations */
.is-visible {
  animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
}

/* Performance tweaks for common animation scenarios */
.transform-gpu {
  transform: translate3d(0, 0, 0) !important;
  will-change: transform !important;
}

.opacity-optimize {
  will-change: opacity;
  backface-visibility: hidden;
}

/* Smooth Hover Effects */
.hover-lift {
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
              box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.hover-lift:hover {
  transform: translateY(-10px) translateZ(0);
  will-change: transform;
}

/* Smooth Click/Focus Effects */
button:active {
  transform: scale(0.98) translateZ(0);
}

/* Optimize Text Rendering during animations */
.animated-text {
  text-rendering: optimizeSpeed;
  will-change: transform;
}

/* Smooth Background Transitions */
.background-smooth {
  background-attachment: fixed;
  will-change: background-position;
  background-size: cover;
  transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Viewport optimization */
@supports (backdrop-filter: blur(10px)) {
  .backdrop-blur {
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
}

/* Contains property for performance */
main, section {
  contain: layout style paint;
}

/* Smooth Scrollbar */
::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.1);
}

::-webkit-scrollbar-thumb {
  background: rgba(200, 200, 200, 0.5);
  border-radius: 5px;
  transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(150, 150, 150, 0.8);
}

  <script type="module">
    // Performance optimization: Use requestAnimationFrame for smooth animations
    let ticking = false;
    let lastScrollY = 0;

    function updateAnimations() {
      // This runs at 60fps, synced with browser refresh
      ticking = false;
    }

    // Passive scroll listener for better performance
    window.addEventListener('scroll', () => {
      lastScrollY = window.scrollY;
      if (!ticking) {
        window.requestAnimationFrame(updateAnimations);
        ticking = true;
      }
    }, { passive: true });

    // Smooth scroll to section
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      }, { passive: true });
    });

    // Intersection Observer for scroll animations (efficient)
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, observerOptions);

    // Observe all animated elements
    document.querySelectorAll('[data-animate]').forEach(el => {
      observer.observe(el);
    });

    // Debounced resize handler
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        // Handle any resize-dependent animations
      }, 250);
    }, { passive: true });

    // Enable GPU acceleration for smooth animations
    if (document.documentElement.style.transform !== undefined) {
      document.documentElement.style.transform = 'translate3d(0, 0, 0)';
    }

    // Prefetch resources for smoother loading
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = '/fonts/OptimisticAI_VF_Optimized.woff2';
    document.head.appendChild(link);

    // Performance monitoring (optional)
    if (window.PerformanceObserver) {
      try {
        const observer = new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            if (entry.duration > 50) {
              console.warn('Animation took', entry.duration, 'ms:', entry.name);
            }
          }
        });
        observer.observe({ entryTypes: ['measure'] });
      } catch (e) {
        // Observer not supported
      }
    }
