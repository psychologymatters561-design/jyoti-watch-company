<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Performance: Preconnect to external resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Jyoti Watch Company - Premium Watches">
  
  <!-- Performance: Preload critical fonts -->
  <link rel="preload" href="/fonts/OptimisticAI_VF_Optimized.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/OptimisticMono_W_TextRegular.woff2" as="font" type="font/woff2" crossorigin>
  
  <title>Jyoti Watch Company - Premium Watches</title>
  
  <style>
    /* === FONT DEFINITIONS === */
    @font-face {
      font-family: "Optimistic";
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
    }
    
    @font-face {
      font-family: "Optimistic Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
    }

    /* === PERFORMANCE: CSS CUSTOM PROPERTIES FOR ANIMATIONS === */
    :root {
      --animation-duration: 300ms;
      --animation-timing: cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: 150ms var(--animation-timing);
      --transition-normal: 300ms var(--animation-timing);
      --transition-slow: 500ms var(--animation-timing);
    }

    /* === CORE RESETS WITH GPU ACCELERATION === */
    *,
    *::after,
    *::before {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      --tw-border-spacing-x: 0;
      --tw-border-spacing-y: 0;
      --tw-translate-x: 0;
      --tw-translate-y: 0;
      --tw-rotate: 0;
      --tw-skew-x: 0;
      --tw-skew-y: 0;
      --tw-scale-x: 1;
      --tw-scale-y: 1;
      /* GPU Acceleration for smooth animations */
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* === FONT APPLICATION === */
    :where(html) {
      font-family: "Optimistic", system-ui, sans-serif;
      scroll-behavior: smooth;
      /* Optimize for rendering */
      text-rendering: optimizeLegibility;
    }

    :where(code, pre, kbd, samp) {
      font-family: "Optimistic Mono", ui-monospace, monospace;
    }

    /* === BODY & LAYOUT OPTIMIZATION === */
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #ffffff;
      color: #1a1a1a;
      line-height: 1.6;
      /* Containment for better performance */
      contain: layout style paint;
    }

    /* === IMAGE OPTIMIZATION === */
    img, video {
      display: block;
      max-width: 100%;
      height: auto;
      /* Prevent layout shift */
      aspect-ratio: auto;
    }

    /* === SMOOTH SCROLL & TRANSITIONS === */
    html {
      scroll-behavior: smooth;
    }

    /* === ANIMATION OPTIMIZATION: FADE IN === */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* === ANIMATION OPTIMIZATION: SLIDE UP WITH GPU === */
    @keyframes slideUpSmooth {
      from {
        opacity: 0;
        transform: translate3d(0, 30px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    /* === ANIMATION OPTIMIZATION: SLIDE IN FROM LEFT WITH GPU === */
    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translate3d(-100%, 0, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    /* === ANIMATION OPTIMIZATION: SCALE WITH GPU === */
    @keyframes scaleInSmooth {
      from {
        opacity: 0;
        transform: scale3d(0.95, 0.95, 1);
      }
      to {
        opacity: 1;
        transform: scale3d(1, 1, 1);
      }
    }

    /* === ANIMATION OPTIMIZATION: ROTATE WITH GPU === */
    @keyframes rotateInSmooth {
      from {
        opacity: 0;
        transform: rotate3d(0, 0, 1, -10deg) scale3d(0.9, 0.9, 1);
      }
      to {
        opacity: 1;
        transform: rotate3d(0, 0, 1, 0deg) scale3d(1, 1, 1);
      }
    }

    /* === ANIMATION OPTIMIZATION: PULSE WITH GPU === */
    @keyframes pulseSmooth {
      0%, 100% {
        opacity: 1;
        transform: scale3d(1, 1, 1);
      }
      50% {
        opacity: 0.8;
        transform: scale3d(1.05, 1.05, 1);
      }
    }

    /* === ANIMATION OPTIMIZATION: FLOAT WITH GPU === */
    @keyframes floatSmooth {
      0%, 100% {
        transform: translate3d(0, 0, 0);
      }
      50% {
        transform: translate3d(0, 8px, 0);
      }
    }

    /* === ANIMATION UTILITY CLASSES === */
    .animate-fade-in {
      animation: fadeIn var(--transition-normal) var(--animation-timing) forwards;
    }

    .animate-slide-up {
      animation: slideUpSmooth var(--transition-normal) var(--animation-timing) forwards;
    }

    .animate-slide-in-left {
      animation: slideInLeft var(--transition-slow) var(--animation-timing) forwards;
    }

    .animate-scale-in {
      animation: scaleInSmooth var(--transition-normal) var(--animation-timing) forwards;
    }

    .animate-rotate-in {
      animation: rotateInSmooth var(--transition-slow) var(--animation-timing) forwards;
    }

    .animate-pulse {
      animation: pulseSmooth 2s var(--animation-timing) infinite;
      will-change: opacity, transform;
    }

    .animate-float {
      animation: floatSmooth 3s ease-in-out infinite;
      will-change: transform;
    }

    /* === SMOOTH HOVER TRANSITIONS === */
    button, a, .interactive {
      transition: all var(--transition-fast);
    }

    button:hover, a:hover {
      will-change: transform, color;
    }

    /* === PERFORMANCE: REDUCE MOTION SUPPORT === */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::after,
      *::before {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* === CRITICAL STYLES (Rest of Tailwind and custom styles) === */
    .container {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    @media (min-width: 640px) {
      .container {
        max-width: 640px;
      }
    }

    @media (min-width: 768px) {
      .container {
        max-width: 768px;
      }
    }

    @media (min-width: 1024px) {
      .container {
        max-width: 1024px;
      }
    }

    @media (min-width: 1280px) {
      .container {
        max-width: 1280px;
      }
    }

    /* === LOAD TIME OPTIMIZATION === */
    .lazy-load {
      opacity: 0;
      animation: fadeIn var(--transition-normal) var(--animation-timing) forwards;
    }

    /* === PAINT OPTIMIZATION === */
    .will-animate {
      will-change: transform, opacity;
    }

    /* === TEXT RENDERING === */
    h1, h2, h3, h4, h5, h6 {
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    p {
      font-weight: 400;
      line-height: 1.6;
    }

    /* === LINK STYLES WITH SMOOTH TRANSITION === */
    a {
      color: #2563eb;
      text-decoration: none;
      transition: color var(--transition-fast), text-decoration var(--transition-fast);
    }

    a:hover {
      color: #1d4ed8;
      text-decoration: underline;
    }

    /* === BUTTON STYLES WITH SMOOTH ANIMATIONS === */
    button {
      cursor: pointer;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 500;
      transition: all var(--transition-fast);
      will-change: background-color, transform;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    /* === INPUT OPTIMIZATION === */
    input, textarea, select {
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      will-change: border-color, box-shadow;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* === SCROLLBAR OPTIMIZATION === */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #f3f4f6;
    }

    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }

    /* === RESPONSIVE IMAGES === */
    picture, img {
      display: block;
    }

    /* === PERFORMANCE HINT: CONTENT VISIBILITY === */
    .off-screen {
      content-visibility: auto;
    }

    /* === LOADING STATE === */
    .skeleton {
      background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- React Script (minified) -->
  <script type="module" src="./app.js" defer></script>
  
  <!-- Performance Monitoring (Optional) -->
  <script>
    // Measure Core Web Vitals for performance tracking
    if ('PerformanceObserver' in window) {
      try {
        // Largest Contentful Paint
        const lcpObserver = new PerformanceObserver((list) => {
          const entries = list.getEntries();
          const lastEntry = entries[entries.length - 1];
          console.log('LCP:', lastEntry.renderTime || lastEntry.loadTime);
        });
        lcpObserver.observe({entryTypes: ['largest-contentful-paint']});

        // Cumulative Layout Shift
        let clsValue = 0;
        const clsObserver = new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            if (!entry.hadRecentInput) {
              clsValue += entry.value;
              console.log('CLS:', clsValue);
            }
          }
        });
        clsObserver.observe({entryTypes: ['layout-shift']});

        // First Input Delay
        const fidObserver = new PerformanceObserver((list) => {
          const entries = list.getEntries();
          entries.forEach((entry) => {
            console.log('FID:', entry.processingDuration);
          });
        });
        fidObserver.observe({entryTypes: ['first-input']});
      } catch (e) {
        console.log('Performance monitoring not available');
      }
    }
  </script>
</body>
</html>
